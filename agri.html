<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="shortcut icon" href="images/Pulsar Icon.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Agricole</title>
</head>
<body>
    <header>
        <img id="logo" src="images/Pulsar Icon.jpeg" alt="">
    </header>
    
    <form onsubmit="event.preventDefault(); calculer();">
        <h1>Pompage Solaire Agricole et irrigation</h1>
        <section class="formulaire">
            <h2>Données agricoles</h2>
            <label>Surface à irriguer (ha)</label>
            <input type="number" id="surface" step="0.1" required>

            <label>Type de culture</label>
            <select id="culture">
                <option value="5">Maïs</option>
                <option value="6">Riz</option>
                <option value="4">Tomate</option>
                <option value="3">Oignon</option>
            </select>

            <label>Rendement irrigation</label>
            <select id="efficiency">
                <option value="0.9">Goutte-à-goutte (90%)</option>
                <option value="0.75">Aspersion</option>
                <option value="0.6">Gravitaire</option>
            </select>
        </section>

        <section class="formulaire">
            <h2>Données hydrauliques</h2>
            <label>Profondeur dynamique (m)</label>
            <input type="number" id="depth" required>

            <label>Hauteur réservoir (m)</label>
            <input type="number" id="tankHeight" required>

            <label>Heures de pompage / jour</label>
            <input type="number" id="hours" value="6" required>
        </section>

        <section class="formulaire">
            <h2>Paramètres solaires</h2>
            <label>Heures solaires utiles </label>
            <input type="number" id="psh" value="5" required>

            <label>Puissance panneau (W)</label>
            <input type="number" id="panelPower" value="550" required>
        </section>

        <button onclick="calculer()" class="calc-btn" id="button">Calculer le système</button>

        <div id="results" class="resultat"></div>
        
        <button class="pdf-btn" id="button"  onclick="generatePDF()">Télécharger le devis en PDF</button>
    </form>

    <footer>
        <section>
            <h3>Contactez - Nous</h3>
            <div class="contact">

                <a href="tel:+22892196727" target="_blank"><i class="fa-solid fa-phone"></i> Téléphone 1</a>
                <a href="tel:+22890104393" target="_blank"><i class="fa-solid fa-phone"></i> Téléphone 2</a>
                <a href="tel:+22893775800" target="_blank"><i class="fa-solid fa-phone"></i> Téléphone 3</a>
            </div>
        </section>

</body>
</html>
