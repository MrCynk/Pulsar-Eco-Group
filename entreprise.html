<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/Pulsar Icon.jpeg" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <title>Entreprises & Institutions</title>
</head>
<body>
    <form onsubmit="event.preventDefault(); calculer();">
        <div class="container">
            <h1>Module Entreprises & Institutions</h1>
            <h3>Inventaire des équipements</h3>

            <table id="equipmentTable">
            <tr>
            <th>Nom</th>
            <th>Puissance (W)</th>
            <th>Quantité</th>
            <th>Heures/Jour</th>
            <th>Action</th>
            </tr>
            </table>

            <button class="add-btn" id="button" onclick="addRow()">+ Ajouter équipement</button>

            <hr>

            <h3>Paramètres du système</h3>

            <label>Type d'installation :</label>
            <select id="typeInstallation">
                <option value="autonome">Autonome</option>
                <option value="hybride">Hybride</option>
                <option value="reseau">Raccordée réseau</option>
            </select>

            <label>Budget disponible (FCFA) :</label>
            <input type="number" id="budget" placeholder="Ex: 1 500 000">

            <br><br>

            <button class="calc-btn" id="button" onclick="calculer()">Calculer Dimensionnement</button>

            <div class="result" id="resultat"></div>

            <button class="pdf-btn" id="button" onclick="genererPDF()">Télécharger Devis PDF</button>
        </div>
    </form>

    <footer>
        <section>
            <h3>Contactez - Nous</h3>
            <div class="contact">
                <a href="https://www.facebook.com/profile.php?id=100063567024819" target="_blank"><i class="fa-brands fa-facebook"></i> Facebook -|-</a>
                <a href="" target="_blank"><i class="fa-brands fa-whatsapp" target="_blank"></i> Whatsapp -|-</a>
                <a href="tel:+22892196727" target="_blank"><i class="fa-solid fa-phone"></i> Téléphone</a>
            </div>
        </section>
        <hr>
        <small><span>P</span>ulsar <span>E</span>co <span>G</span>roup</small>
        <small>Tous droits résevés - 2026</small>
    </footer>
    <script src="entre.js"></script>
</body>
</html>
